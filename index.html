$('world').innerHTML=`<div class="section-head"><h2>《伪造》· 完整世界</h2><span class="sub">画面已认可 · 文字讨论稿</span></div><div class="hero"><button class="art" data-image="${hero.id}" aria-label="放大 堤墙两侧"><img src="${hero.preview}" alt="堤墙两侧：外侧枯根黑泥，内侧朱红院场"></button><div class="hero-copy"><span class="pill">已认可的画面基准</span><h2>自然已经受损。<br>生活仍在继续。</h2><p>以未来上海的地理为起点，用中式空间、先进技术和人工自然，建立一个容纳不同故事的城市。</p><div class="sub">21节完整设定 · 42项资产规则 · 当前只讨论，不生图</div><div class="hero-actions"><button data-world-jump="world-reading">阅读完整设定 ↓</button><button class="secondary" data-world-jump="world-catalog">查看图位目录 ↓</button></div></div></div><div class="section-head"><h2>四区，一座城</h2><span class="sub">名称 · 配色 · 场景名已认可</span></div>${districts()}<div class="note">四区名称与配色已认可，区内的具体建筑、人物服装与单张场景图仍按项选择。朱庭已确定为沿海宗教礼仪区。</div><div class="rules"><div class="rule"><b>01 / 世界的前提</b><p>长期严重生态恶化。树、水、空气与材料的变化，进入每个人的日常。</p></div><div class="rule"><b>02 / 当前的视觉</b><p>纯色厚墙、深门洞和极轻膜面。不再沿用早期欧美复古外观，也不出现当代上海地标。</p></div><div class="rule"><b>03 / 系列的尺度</b><p>同城可以讲不同人物、不同题材。周五升月只是城市的一项习俗。</p></div></div><div class="section-head" id="world-reading"><h2>完整设定 · 21章</h2><a class="sub" href="${doc('world')}" download="完整设定_V1.md">下载来源文档 ↓</a></div><div class="doc-source">当前依据：《完整世界设定 V1》，21节正文与42项资产。新增规则为讨论提案，未自动采用。</div>${chapters(board.documents.world,'world')}<details class="catalog-block" data-detail="catalog-wrapper" id="world-catalog"><summary>图位总目录 · 106项建议，待取舍</summary><div class="section-head"><h2>世界设定总目录</h2><a class="sub" href="${doc('catalog')}" download="世界总目录.md">下载总目录 ↓</a></div><div class="districts">${Object.entries(board.catalog_summary||{}).map(([name,count])=>`<article class="district" style="--tone:#396277"><small>基础图位建议</small><h3>${count}</h3><strong>${esc(name)}</strong></article>`).join('')}</div><details data-detail="catalog-all"><summary>逐项查看总目录</summary>${chapters(board.documents.catalog||'','catalog')}</details></details><details data-detail="bible"><summary>总集原文 · 历史母本</summary><div class="note">保留世界与资产来源；与当前上海版冲突的内容，以当前采用记录为准。</div><div class="prose">${markdown(board.documents.bible)}</div><a href="${doc('bible')}" download="总集阅读版.md">下载总集阅读版 ↓</a></details>`;
const approved=board.items.filter(i=>i.group==='approved');$('approved-count').textContent=approved.length;
$('approved').innerHTML=`<div class="section-head"><div><h2>你已认可的画面</h2><div class="sub">只收有明确认可记录的单图 · 当前 ${approved.length} 张</div></div><span class="pill">已采用</span></div><div class="approved-grid">${approved.map(i=>`<article class="approved-card">${imgButton(i)}<div class="card-copy"><h3>${esc(i.title)}</h3><span class="pill">${esc(i.scope)}</span><p>${esc(i.description)}</p><blockquote>${esc(i.evidence)}</blockquote><div class="sub">认可记录 ${esc(i.adopted)} · 来源：当前聊天 / 设定集采用记录</div></div></article>`).join('')}</div><div class="note">早期《人工地平线》属于历史方向认可；当前已转到未来江城。上海十景与第一集分镜仍为候选，不在本栏混入。</div>`;
const final=board.items.find(i=>i.id==='shot-12');const beats=[['00:00–00:09','石青通学廊 · 放学交接','还页、看向接领门、接到母亲。从普通的放学动作进入未来城市。'],['00:09–00:14','石青家 · 吃饭备垫','男孩吃完最后一口饭。母亲把两张浅色折坐垫叠齐，装进袋里。'],['00:14–00:27','家门到渡口 · 看见影纱','重新背包出门。孩子接住一片梧桐影，看见轻纱的系点，然后登上净气渡舱。'],['00:27–00:41','瓷白渡到黛园 · 假鸟与真枝','隔舱窗看水样，再看浮标单翼报潮。上岸经过黛园公共前廊，看见真枝顶起护膜。'],['00:41–00:52','朱庭 · 越堤候月','枯根与朱红院场在同一堵墙两侧。母亲铺好两张坐垫，孩子学着周围的人摊开手掌。'],['00:52–01:00','沿海礼场 · 广场升月','周五晚八点，极轻的白色月衣从厚堤升起。最后给出月亮、人群与海堤的共同尺度。']];
$('story').innerHTML=`<div class="story-top"><div><div class="eyebrow">EPISODE 01 / 第一集</div><h2>赴月</h2><span class="pill pending">世界设定优先 · 本集暂缓</span><p>一个男孩放学，被家长接回家，再一起穿过城市，去朱庭广场等候升月。</p><p>两张浅色坐垫贯穿全程：在家装进袋子，在礼场铺开。沿途所见，让这个世界从生活里显露。</p></div>${imgButton(final)}</div><div class="route">${board.districts.map((_,i)=>board.districts[[1,2,3,0][i]]).map(d=>`<span style="--tone:${d.color}">${d.name}</span>`).join('<span>→</span>')}</div><div class="note">已定：男孩放学 → 家长接回家 → 一起赴朱庭升月。工作稿：母亲接领、60 秒、人物造型与摊掌候月礼，待选定。</div><div class="beats">${beats.map(b=>`<article class="beat"><small>${b[0]}</small><h3>${b[1]}</h3><p>${b[2]}</p></article>`).join('')}</div><div class="section-head"><h2>逐镜剧情原文</h2><a class="sub" href="${doc('story')}" download="沿途设定.md">下载沿途设定 ↓</a></div><details data-detail="story-full"><summary>展开《沿途设定》完整正文</summary><div class="prose">${markdown(board.documents.story)}</div></details>`;

function renderShots(){const q=$('search').value.trim().toLowerCase(),items=board.items.filter(i=>i.group===mode&&[i.title,i.location,i.description].join(' ').toLowerCase().includes(q));$('shot-list').className='shot-grid'+(mode==='panels'?' panel-grid':'');$('shot-list').innerHTML=items.map(i=>`<article class="shot">${imgButton(i)}<div class="card-copy"><div class="meta"><span>${i.number?'镜头 '+String(i.number).padStart(2,'0'):'原始三格画板'}</span><span class="time">${i.number?time(i.start)+'—'+time(i.end):'V1'}</span></div><h3>${esc(i.title)}</h3><span class="pill pending">${esc(i.status)}</span><p>${esc(i.location||'')}</p><p>${esc(i.description)}</p>${i.sound?`<p class="sound">声音 / 调度提案：${esc(i.sound)}</p>`:''}</div></article>`).join('')||'<p class="empty">没有匹配的分镜。试试“朱庭”或“树影”。</p>'}
function renderInbox(){const items=board.items.filter(i=>i.group==='inbox');$('tab-inbox').hidden=!items.length;$('inbox-count').textContent=items.length;$('inbox-list').innerHTML=items.map(i=>`<article class="shot">${/\.(mp4|mp3|wav)$/i.test(i.source_file)?`<a href="${esc(i.original)}" target="_blank" rel="noopener">打开 ${esc(i.title)}</a>`:imgButton(i)}<div class="card-copy"><h3>${esc(i.title)}</h3><span class="pill pending">待归类 · 未采用</span></div></article>`).join('');if(!items.length&&active==='inbox')selectTab('world',false)}
function selectTab(id,scroll=true){active=id;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));document.querySelectorAll('[role=tabpanel]').forEach(s=>s.hidden=s.id!==id);history.replaceState(null,'','#'+id);if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function showImage(id){const item=board.items.find(i=>i.id===id);if(!item)return;openId=id;gallery=board.items.filter(i=>i.group===item.group).map(i=>i.id);$('viewer-image').src=item.original;$('viewer-image').alt=item.title;$('viewer-title').textContent=(item.number?String(item.number).padStart(2,'0')+' · ':'')+item.title;$('viewer-status').textContent=item.status;$('viewer-status').className='pill'+(item.group==='approved'?'':' pending');$('viewer-description').textContent=item.description||item.purpose||'';$('counter').textContent=(gallery.indexOf(id)+1)+' / '+gallery.length;$('original').href=item.original;$('previous').disabled=gallery.length<2;$('next').disabled=gallery.length<2;if(!$('viewer').open)$('viewer').showModal()}
function advance(n){if(gallery.length)showImage(gallery[(gallery.indexOf(openId)+n+gallery.length)%gallery.length])}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab)selectTab(tab.dataset.tab);const image=e.target.closest('[data-image]');if(image)showImage(image.dataset.image);const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));renderShots()}});
$('search').addEventListener('input',renderShots);$('close-viewer').onclick=()=>$('viewer').close();$('previous').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);$('viewer').addEventListener('close',()=>{openId=null});document.addEventListener('keydown',e=>{if($('viewer').open){if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1)}});
window.addEventListener('project-board-update',e=>{const scroll=window.scrollY,expanded=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.detail),selected=openId;board=e.detail;const signature=JSON.stringify([board.documents,board.districts,board.items.filter(i=>i.group!=='inbox')]);if(signature!==pageSignature){renderMain();renderShots();pageSignature=signature;expanded.forEach(id=>document.querySelector(`[data-detail="${id}"]`)?.setAttribute('open',''));if(selected)showImage(selected)}renderInbox();selectTab(active,false);window.scrollTo(0,scroll);$('updated').textContent='已载入 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})});
window.addEventListener('project-board-status',e=>{const ok=e.detail==='connected';$('connection').textContent=ok?'云端版本已载入':'加载失败 · 请刷新';$('connection').className='live'+(ok?'':' off')});
const initial=location.hash.slice(1);if(['world','approved','story','shots'].includes(initial))active=initial;
